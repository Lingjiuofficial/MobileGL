name: Build MGL (MobileGL)

# === 使用步骤 ===
# 1. Fork https://github.com/MobileGL-Dev/MobileGL
# 2. 在 fork 里创建 .github/workflows/build-mgl.yml，粘贴此文件
# 3. Actions → Build MGL → Run workflow → 选参数 → 等 ~15 分钟
# 4. 下载 APK artifact → 安装到手机 → ZL2 启动器选 MobileGL 渲染器
# ================
# Magma(Vulkan)/Espryt(GLES) 运行时在启动器设置里切换，不用分开编译

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体'
        type: choice
        options: [pluginDebug, pluginRelease]
        default: 'pluginDebug'
      abi:
        description: '目标架构'
        type: choice
        options: [arm64-v8a, 'arm64-v8a,x86_64']
        default: 'arm64-v8a'

env:
  NDK_VER: '27.3.13750724'
  SDK_PLATFORM: '34'
  BUILD_TOOLS: '34.0.0'
  GRADLE_VER: '8.9'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码 + 子模块
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Android SDK + NDK
        run: |
          SDK_ROOT=$HOME/android-sdk
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VER" >> $GITHUB_ENV

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mkdir -p "$SDK_ROOT/cmdline-tools"
          mv cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$SDK_PLATFORM" \
            "build-tools;$BUILD_TOOLS" \
            "ndk;$NDK_VER"

      - name: 安装 Gradle
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-$GRADLE_VER-bin.zip"
          unzip -q "gradle-$GRADLE_VER-bin.zip"
          echo "$PWD/gradle-$GRADLE_VER/bin" >> $GITHUB_PATH

      - name: 生成临时签名（Release 需要）
        run: |
          keytool -genkey -v \
            -keystore android-plugin/keystore.jks \
            -alias mgl-ci \
            -keyalg RSA -keysize 2048 -validity 365 \
            -storepass android \
            -keypass android \
            -dname "CN=CI, OU=MGL, O=GitHub, L=N/A, S=N/A, C=CN" \
            -noprompt 2>/dev/null
          echo "SIGNING_STORE_PASSWORD=android" >> $GITHUB_ENV
          echo "SIGNING_KEY_ALIAS=mgl-ci" >> $GITHUB_ENV
          echo "SIGNING_KEY_PASSWORD=android" >> $GITHUB_ENV

      - name: 构建
        run: |
          cat > android-plugin/local.properties << EOF
          sdk.dir=$ANDROID_SDK_ROOT
          ndk.dir=$ANDROID_NDK_HOME
          EOF

          cd android-plugin
          gradle :app:assemble${{ inputs.variant }} \
            --no-daemon \
            -Pmobilegl.abis=${{ inputs.abi }}

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MGL-${{ inputs.variant }}-${{ inputs.abi }}
          path: android-plugin/app/build/outputs/apk/**/*.apk
